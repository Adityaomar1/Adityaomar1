<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#001a00"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00ffea"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clipRect">
      <rect x="0" y="0" width="1200" height="260" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipRect)">
    <rect width="1200" height="260" fill="url(#bgGrad)"/>

    <!-- Matrix rain columns -->
    <g font-family="Fira Code, monospace" font-size="16" fill="#00ff41" opacity="0.55">
      <!-- Each column: a vertical string of chars falling and looping -->
      <g>
        <text x="20" y="0">01</text>
        <animateTransform attributeName="transform" type="translate" from="0,-40" to="0,300" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="55" y="0">ﾊﾐ</text>
        <animateTransform attributeName="transform" type="translate" from="0,-60" to="0,300" dur="2.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="90" y="0">10</text>
        <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,300" dur="3.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="125" y="0">ｱｲ</text>
        <animateTransform attributeName="transform" type="translate" from="0,-80" to="0,300" dur="2.9s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="160" y="0">ML</text>
        <animateTransform attributeName="transform" type="translate" from="0,-30" to="0,300" dur="3.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="195" y="0">01</text>
        <animateTransform attributeName="transform" type="translate" from="0,-50" to="0,300" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="230" y="0">ｳｴ</text>
        <animateTransform attributeName="transform" type="translate" from="0,-10" to="0,300" dur="3.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="265" y="0">AI</text>
        <animateTransform attributeName="transform" type="translate" from="0,-70" to="0,300" dur="2.7s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="960" y="0">10</text>
        <animateTransform attributeName="transform" type="translate" from="0,-45" to="0,300" dur="3.1s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="995" y="0">ｵｶ</text>
        <animateTransform attributeName="transform" type="translate" from="0,-15" to="0,300" dur="2.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="1030" y="0">C++</text>
        <animateTransform attributeName="transform" type="translate" from="0,-65" to="0,300" dur="3.5s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="1075" y="0">01</text>
        <animateTransform attributeName="transform" type="translate" from="0,-25" to="0,300" dur="2.5s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="1110" y="0">ﾜﾝ</text>
        <animateTransform attributeName="transform" type="translate" from="0,-55" to="0,300" dur="3.3s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="1150" y="0">JS</text>
        <animateTransform attributeName="transform" type="translate" from="0,-35" to="0,300" dur="2.9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- subtle scanline -->
    <rect x="0" y="0" width="1200" height="3" fill="#00ff41" opacity="0.25">
      <animate attributeName="y" from="0" to="260" dur="2.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Glitch name block -->
    <g filter="url(#glow)">
      <text x="600" y="120" text-anchor="middle" font-family="Fira Code, monospace" font-size="58" font-weight="700" fill="#ff2b6d" opacity="0.7">
        ADITYA OMAR
        <animate attributeName="x" values="600;596;604;598;600" dur="0.35s" begin="0s;g1.end+2.6s" id="g1" repeatCount="1"/>
      </text>
      <text x="600" y="120" text-anchor="middle" font-family="Fira Code, monospace" font-size="58" font-weight="700" fill="#00ffea" opacity="0.7">
        ADITYA OMAR
        <animate attributeName="x" values="600;604;596;602;600" dur="0.35s" begin="0.05s;g2.end+2.6s" id="g2" repeatCount="1"/>
      </text>
      <text x="600" y="120" text-anchor="middle" font-family="Fira Code, monospace" font-size="58" font-weight="700" fill="url(#glowGrad)">
        ADITYA OMAR
      </text>
    </g>

    <text x="600" y="165" text-anchor="middle" font-family="Fira Code, monospace" font-size="22" fill="#00ff41" filter="url(#glow)">
      &gt; AI &#8226; ML &#8226; Frontend Developer_
      <animate attributeName="opacity" values="1;1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="200" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" fill="#5eead4" opacity="0.85">
      Turning coffee into code ☕
    </text>

    <!-- border glow -->
    <rect x="2" y="2" width="1196" height="256" rx="14" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
