<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a00"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="glowGradF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00ffea"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clipRectF">
      <rect x="0" y="0" width="1200" height="140" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipRectF)">
    <rect width="1200" height="140" fill="url(#bgGradF)"/>

    <!-- Matrix rain columns, sparser than header -->
    <g font-family="Fira Code, monospace" font-size="14" fill="#00ff41" opacity="0.4">
      <g>
        <text x="40" y="0">01</text>
        <animateTransform attributeName="transform" type="translate" from="0,-30" to="0,180" dur="3.0s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="90" y="0">ｱｲ</text>
        <animateTransform attributeName="transform" type="translate" from="0,-50" to="0,180" dur="2.5s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="140" y="0">ML</text>
        <animateTransform attributeName="transform" type="translate" from="0,-10" to="0,180" dur="3.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="190" y="0">10</text>
        <animateTransform attributeName="transform" type="translate" from="0,-40" to="0,180" dur="2.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="1000" y="0">C++</text>
        <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,180" dur="3.1s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="1050" y="0">01</text>
        <animateTransform attributeName="transform" type="translate" from="0,-55" to="0,180" dur="2.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="1100" y="0">ﾜﾝ</text>
        <animateTransform attributeName="transform" type="translate" from="0,-15" to="0,180" dur="3.5s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="1150" y="0">JS</text>
        <animateTransform attributeName="transform" type="translate" from="0,-35" to="0,180" dur="2.9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- scanline moving upward this time, mirroring header -->
    <rect x="0" y="140" width="1200" height="2" fill="#00ff41" opacity="0.25">
      <animate attributeName="y" from="140" to="0" dur="2.5s" repeatCount="indefinite"/>
    </rect>

    <!-- closing message -->
    <text x="600" y="70" text-anchor="middle" font-family="Fira Code, monospace" font-size="24" font-weight="600" fill="url(#glowGradF)" filter="url(#glowF)">
      &lt;/ Thanks for stopping by &gt;
    </text>

    <text x="600" y="100" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" fill="#5eead4" opacity="0.85">
      "Learning every day, building step by step."
      <animate attributeName="opacity" values="0.85;0.85;0.2;0.85" dur="1.4s" repeatCount="indefinite"/>
    </text>

    <!-- border glow -->
    <rect x="2" y="2" width="1196" height="136" rx="14" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
